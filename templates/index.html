{% extends "base.html" %}
{% block content %}
<div class="hero">
    <h1>Qaysi usta kerak?</h1>
    <p>Yo'nalishni tanlang va arizangizni qoldiring — tegishli usta siz bilan bog'lanadi.</p>
</div>

<div class="list">
    {% for c in categories %}
    <a class="list-item" href="{{ url_for('order_form', category_id=c['id']) }}">
        <span class="label">{{ c['name'] }}</span>
        <span class="arrow">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M6.5 3L12.5 9L6.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </a>
    {% endfor %}
</div>
{% endblock %}
